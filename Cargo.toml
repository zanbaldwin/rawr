[workspace]
resolver = "2"
members = [".", "crates/*"]

[workspace.package]
rust-version = "1.92"
authors = ["Zan Baldwin"]
edition = "2024"
license = "MIT"
version = "0.1.0-beta"

[workspace.dependencies]
async-compression = "^0.4.41"
async-stream = "^0.3.6"
async-trait = "^0.1"
opendal = "^0.55.0"
blake3 = "^1.8"
brotli = "^8.0"
bzip2 = "^0.6.0"
clap = "^4.5"
console = "^0.16.2"
crc32fast = "^1.5"
derive_more = "^2.1"
dialoguer = "^0.12.0"
directories = "^6.0"
exn = "^0.3"
fast_html2md = "^0.0.58"
figment = "^0.10.19"
flate2 = "^1.1"
futures = "^0.3.30"
html5ever = "^0.39.0"
indicatif = "^0.18.4"
libbzip3-sys = { version = "^0.5", features = ["bundled"] }
liblzma = "^0.4.6"
memchr = "^2.8"
miette = "^7.6"
pin-project-lite = "^0.2.17"
regex = "^1.12"
rslug = "^0.3"
rstest = "^0.26"
rust-embed = "^8.11"
scraper = { git = "https://github.com/rust-scraper/scraper", rev = "bca18390fa23e367ba3980e930454f87c6b13131" }
serde = "^1.0"
serde_json = "^1.0"
similar = "^2.7"
sqlx = "^0.8.6"
tempfile = "^3.25"
tendril = "^0.5.0"
time = "^0.3.47"
tokio = { version = "^1.49", default-features = false }
tracing = "^0.1.0"
tracing-subscriber = "^0.3.22"
upon = "^0.10.0"
which = "^8.0"
zstd = "^0.13"

[package]
name = "rawr-cli"
description = "Rawr CLI Tool"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "rawr"
path = "src/main.rs"

[features]
default = ["s3", "pdf", "epub"]
brotli = ["rawr-compress/brotli"]
bzip3 = ["rawr-compress/bzip3"]
xz = ["rawr-compress/xz"]
zstd = ["rawr-compress/zstd"]
s3 = ["rawr-storage/s3"]
pdf = []
epub = []

[dependencies]
clap = { workspace = true, features = ["derive"] }
console = { workspace = true }
dialoguer = { workspace = true }
exn = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }
miette = { workspace = true }
rawr-cache = { path = "crates/cache" }
rawr-compress = { path = "crates/compress", features = ["cli"] }
rawr-config = { path = "crates/config" }
rawr-extract = { path = "crates/extract" }
rawr-library = { path = "crates/library" }
rawr-storage = { path = "crates/storage" }
similar = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
