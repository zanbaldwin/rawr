[package]
name = "rawr-audiobook"
description = "Audiobook construction: EPUB 3 with Media Overlays from narrated documents"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []

[dependencies]
blake3 = { workspace = true }
crc32fast = { workspace = true }
derive_more = { workspace = true, features = ["display", "error"] }
exn = { workspace = true }
futures = { workspace = true, features = ["std"] }
rawr-source = { workspace = true }
rawr-storage = { workspace = true }
rawr-tts = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing", "serde"] }
tokio = { workspace = true, features = ["time"] }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
crc32fast = { workspace = true }
futures = { workspace = true, features = ["std"] }
insta = { workspace = true }
rawr-compress = { workspace = true }
rawr-source = { workspace = true, features = ["ao3"] }
rawr-storage = { workspace = true, features = ["mock"] }
rawr-tts = { workspace = true, features = ["fake"] }
rstest = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt"] }
