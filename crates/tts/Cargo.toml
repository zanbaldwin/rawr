[package]
name = "rawr-tts"
description = "Text-to-speech: a provider-neutral synthesiser trait and its providers"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
fake = []
elevenlabs = ["dep:base64", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:tracing"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["display", "error"] }
exn = { workspace = true }
rawr-source = { workspace = true }
reqwest = { version = "^0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
rstest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
