[package]
name = "rawr-web"
description = "LAN web API + app for browsing your rawr library"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["s3"]
_sync = []
s3 = ["_sync", "rawr-storage/s3", "rawr-app/s3"]
# Generates the committed TypeScript bindings (`cargo test -p rawr-web
# --features ts`); release builds carry no ts-rs proc macro.
ts = ["dep:ts-rs"]

[[bin]]
name = "rawr-web"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = [
    "http1",
    "tokio",
    "json",
    "query",
    "form",
    "multipart",
    "matched-path",
    "tracing",
] }
blake3 = { workspace = true }
# Direct flate2/brotli at moderate levels: rawr-compress hard-codes maximum
# levels by design, and q11 brotli over a ~6 MB index is seconds of latency.
brotli = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
derive_more = { workspace = true, features = ["display", "error"] }
exn = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true, features = ["std"] }
rawr-app = { workspace = true, features = ["render"] }
rawr-cache = { workspace = true }
# All four optional codecs are MANDATORY here, not features: a codec that is
# not compiled in makes FileRow -> File conversion fail, so works stored with
# it become unlistable and break the whole index. bzip3 needs clang.
rawr-compress = { workspace = true, features = ["brotli", "bzip3", "xz", "zstd"] }
rawr-config = { workspace = true }
rawr-extract = { workspace = true, features = ["chapters", "serde"] }
rawr-library = { workspace = true }
rawr-render = { workspace = true, features = ["epub"] }
rawr-storage = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true, features = ["compat", "io"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "ansi", "env-filter"] }
ts-rs = { workspace = true, optional = true }

rust-embed = { workspace = true, features = ["include-exclude"] }
vite-chunks = { workspace = true }

[build-dependencies]
vite-chunks = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
